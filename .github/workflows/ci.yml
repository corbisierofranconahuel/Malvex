name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore .\Malvex.sln

      - name: Build
        run: dotnet build .\Malvex.sln -c Release --no-restore

      - name: Test
        run: dotnet test .\Malvex.sln -c Release --no-build
